<div class="modal-backdrop" data-modal-root>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="campaign-modal-title">
    <div class="modal__header">
      <h2 class="modal__title" id="campaign-modal-title">{{ "Create Campaign" if mode == "create" else "Edit " ~ campaign.name }}</h2>
      <button class="modal__close" type="button" onclick="this.closest('[data-modal-root]').remove()" aria-label="Close">&times;</button>
    </div>
    <div class="modal__body">
      {% import "campaigns/_form_fields.html" as fields %}
      <form method="post" action="{{ url_for('campaigns.new_campaign') if mode == 'create' else url_for('campaigns.edit_campaign', campaign_id=campaign.id) }}" hx-post="{{ url_for('campaigns.new_campaign') if mode == 'create' else url_for('campaigns.edit_campaign', campaign_id=campaign.id) }}" hx-target="closest [data-modal-root]" hx-swap="outerHTML">
        {{ form.hidden_tag() }}
        {{ fields.campaign_form_fields(form) }}
        <div class="form-actions">
          <button class="btn" type="button" onclick="this.closest('[data-modal-root]').remove()">Cancel</button>
          <button class="btn btn--primary" type="submit">{{ "Create Campaign" if mode == "create" else "Save Changes" }}</button>
        </div>
      </form>
    </div>
  </div>
</div>
